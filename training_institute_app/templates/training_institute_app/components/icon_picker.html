// Icon Picker Generator Function
function generateIconPickerHTML(field) {
    const containerId = `icon-picker-${field.name.replace(/[\[\]]/g, '-')}-${Date.now()}`;
    const currentValue = field.value || 'fa-solid fa-star';
    
    let iconsHtml = '';
    fontAwesomeIcons.forEach(icon => {
        const isSelected = icon.class === currentValue;
        iconsHtml += `
            <div class="icon-option ${isSelected ? 'selected' : ''}" data-icon-class="${icon.class}">
                <i class="${icon.class} icon-option-icon"></i>
                <span class="icon-option-name">${icon.name}</span>
            </div>
        `;
    });
    
    return `
        <div class="icon-picker-container" id="${containerId}" data-field-name="${field.name}">
            <div class="icon-preview" id="${containerId}-preview">
                <i class="${currentValue} icon-preview-icon"></i>
                <span class="icon-preview-text">${currentValue}</span>
                <i class="fas fa-chevron-down" style="margin-left: auto; font-size: 12px; color: #94a3b8;"></i>
            </div>
            <div class="icon-dropdown" id="${containerId}-dropdown">
                <div class="icon-search">
                    <input type="text" placeholder="🔍 Search icons..." id="${containerId}-search" autocomplete="off">
                </div>
                <div class="icon-list" id="${containerId}-list">
                    ${iconsHtml}
                </div>
            </div>
            <input type="hidden" name="${field.name}" id="${field.name}" value="${currentValue}">
        </div>
    `;
}

function initIconPickers() {
    document.querySelectorAll('.icon-picker-container').forEach(container => {
        if (container.hasAttribute('data-initialized')) return;
        container.setAttribute('data-initialized', 'true');
        
        const preview = container.querySelector('.icon-preview');
        const dropdown = container.querySelector('.icon-dropdown');
        const hiddenInput = container.querySelector('input[type="hidden"]');
        const searchInput = container.querySelector('.icon-search input');
        const iconList = container.querySelector('.icon-list');
        
        // Toggle dropdown
        preview.addEventListener('click', function(e) {
            e.stopPropagation();
            document.querySelectorAll('.icon-dropdown.show').forEach(d => {
                if (d !== dropdown) d.classList.remove('show');
            });
            dropdown.classList.toggle('show');
        });
        
        // Search functionality
        if (searchInput) {
            searchInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                const allOptions = iconList.querySelectorAll('.icon-option');
                
                allOptions.forEach(option => {
                    const iconName = option.querySelector('.icon-option-name')?.textContent.toLowerCase() || '';
                    const iconClass = option.dataset.iconClass?.toLowerCase() || '';
                    
                    if (iconName.includes(searchTerm) || iconClass.includes(searchTerm)) {
                        option.style.display = 'flex';
                    } else {
                        option.style.display = 'none';
                    }
                });
            });
        }
        
        // Select icon
        iconList.querySelectorAll('.icon-option').forEach(option => {
            option.addEventListener('click', function() {
                const iconClass = this.dataset.iconClass;
                if (iconClass) {
                    const previewIcon = preview.querySelector('.icon-preview-icon');
                    if (previewIcon) previewIcon.className = `${iconClass} icon-preview-icon`;
                    
                    const previewText = preview.querySelector('.icon-preview-text');
                    if (previewText) previewText.textContent = iconClass;
                    
                    if (hiddenInput) hiddenInput.value = iconClass;
                    
                    iconList.querySelectorAll('.icon-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    dropdown.classList.remove('show');
                    
                    const changeEvent = new Event('change', { bubbles: true });
                    hiddenInput.dispatchEvent(changeEvent);
                }
            });
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!container.contains(e.target)) dropdown.classList.remove('show');
        });
    });
}

// Make functions available globally
window.fontAwesomeIcons = fontAwesomeIcons;

window.initIconPickers = initIconPickers;
