{% load static %}
<nav class="top-nav" id="topNav">
  <a href="/" class="nav-brand">
    <img src="{% static 'images/logoSample.png' %}" alt="Training Institute" class="nav-logo">
  </a>
  
  <!-- Simple Search Component -->
  <div class="nav-search">
    <div class="nav-search-container">
      <button class="nav-search-icon" id="navSearchIcon" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <input type="text" class="nav-search-input" id="navSearchInput" placeholder="Search courses...">
    </div>
  </div>

  <ul class="nav-links">
    <li><a href="/about">About Us</a></li>
    <li><a href="/courses">Courses</a></li>
    <li><a href="/contact">Contact</a></li>
  </ul>
  <a href="/login" class="nav-cta">Log In</a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
    <span class="toggle-bar"></span><span class="toggle-bar"></span>
  </button>
</nav>

<style>
/* Simple Search Component */
.nav-search {
  margin-right: 24px;
}

.nav-search-container {
  display: flex;
  align-items: center;
  background: rgba(22, 26, 32, 0.6);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(156, 163, 175, 0.15);
  border-radius: 100px;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.nav-search-container:focus-within {
  border-color: rgba(176, 184, 196, 0.4);
  background: rgba(22, 26, 32, 0.9);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.nav-search-icon {
  background: none;
  border: none;
  padding: 0;
  margin-left: 16px;
  margin-right: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #9CA3AF;
  transition: color 0.3s ease;
}

.nav-search-icon:hover {
  color: #E5E7EB;
}

.nav-search-input {
  background: transparent;
  border: none;
  padding: 10px 16px 10px 0;
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  font-weight: 400;
  color: #E5E7EB;
  width: 0;
  opacity: 0;
  transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
  outline: none;
}

.nav-search-container.expanded .nav-search-input {
  width: 200px;
  opacity: 1;
}

/* Responsive */
@media (max-width: 1024px) {
  .nav-search {
    margin-right: 16px;
  }
  .nav-search-container.expanded .nav-search-input {
    width: 150px;
  }
}

@media (max-width: 768px) {
  .nav-search {
    margin-right: 12px;
  }
  .nav-search-container.expanded .nav-search-input {
    width: 120px;
  }
}
</style>

<script>
// Simple search functionality
(function() {
  const searchContainer = document.querySelector('.nav-search-container');
  const searchIcon = document.getElementById('navSearchIcon');
  const searchInput = document.getElementById('navSearchInput');
  
  let isExpanded = false;
  
  function expandSearch() {
    if (isExpanded) return;
    isExpanded = true;
    searchContainer.classList.add('expanded');
    searchInput.focus();
  }
  
  function collapseSearch() {
    if (!isExpanded) return;
    isExpanded = false;
    searchContainer.classList.remove('expanded');
    searchInput.value = '';
    searchInput.blur();
  }
  
  searchIcon.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isExpanded) {
      collapseSearch();
    } else {
      expandSearch();
    }
  });
  
  searchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && searchInput.value.trim()) {
      const query = searchInput.value.trim();
      // Redirect to search results page (update URL as needed)
      window.location.href = `/search/?q=${encodeURIComponent(query)}`;
    }
  });
  
  // Collapse when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.nav-search')) {
      collapseSearch();
    }
  });
  
  // Handle escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isExpanded) {
      collapseSearch();
    }
  });
})();
</script>
