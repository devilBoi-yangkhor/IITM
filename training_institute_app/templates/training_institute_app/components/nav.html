{% load static %}
<nav class="top-nav" id="topNav">
  <a href="/" class="nav-brand">
    <div class="logo-wrapper">
      <div class="logo-icon">
        <img src="{% static 'images/logo.png' %}" alt="Training Institute" class="nav-logo">
        <div class="logo-glow"></div>
      </div>
    </div>
  </a>

  <!-- Simple Search Component -->
  <div class="nav-search">
    <div class="nav-search-container">
      <button class="nav-search-icon" id="navSearchIcon" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
      <input type="text" class="nav-search-input" id="navSearchInput" placeholder="Search courses...">
    </div>
  </div>

  <ul class="nav-links">
    <li><a href="/about">About Us</a></li>
    <li><a href="/courses">Courses</a></li>
    <li><a href="/contact">Contact</a></li>
  </ul>
  {% if user.is_authenticated %}
  <a href="/dashboard/" class="nav-cta">Dashboard</a>
  {% else %}
  <a href="/login" class="nav-cta">Log In</a>
  {% endif %}
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
    <span class="toggle-bar"></span><span class="toggle-bar"></span>
  </button>
</nav>

<!-- Mobile Menu - Integrated with Login Button -->
<div class="mobile-menu" id="mobileMenu">
  <div class="mobile-menu-inner">
    <div class="mobile-menu-links">
      <a href="/about" class="mobile-menu-link" data-index="01">About Us</a>
      <a href="/courses" class="mobile-menu-link" data-index="02">Courses</a>
      <a href="/contact" class="mobile-menu-link" data-index="03">Contact</a>
      {% if user.is_authenticated %}
      <a href="/dashboard/" class="mobile-menu-link mobile-cta-link" data-index="04">Dashboard</a>
      {% else %}
      <a href="/login" class="mobile-menu-link mobile-cta-link" data-index="04">Log In</a>
      {% endif %}
    </div>
    <div class="mobile-menu-footer">
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
    </div>
  </div>
</div>

<style>
  /* Override conflicting base styles */
  .top-nav {
    padding: 20px 40px !important;
    background: transparent !important;
  }

  .top-nav.scrolled {
    background: rgba(255, 255, 255, 0.95) !important;
    backdrop-filter: blur(20px) !important;
    padding: 12px 40px !important;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
  }

  /* Modern Professional Logo Styles */
  .nav-brand {
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 601;
  }

  .logo-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }

  .logo-icon {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-logo {
    width: 60px;
    height: 60px;
    object-fit: contain;
    filter: none; /* Changed from brightness(0) invert(1) */
    transition: all 0.3s ease;
    position: relative;
    z-index: 2;
  }

  .nav-brand:hover .nav-logo {
    transform: scale(1.1);
  }

  /* Glow Effect on Hover */
  .logo-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background: radial-gradient(circle at center, rgba(255, 255, 255, 0.4) 0%, rgba(102, 126, 234, 0.3) 50%, transparent 70%);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .nav-brand:hover .logo-glow {
    opacity: 1;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% {
      transform: translate(-50%, -50%) scale(0.8);
      opacity: 0;
    }

    50% {
      transform: translate(-50%, -50%) scale(1.2);
      opacity: 0.6;
    }

    100% {
      transform: translate(-50%, -50%) scale(1.6);
      opacity: 0;
    }
  }

  /* Simple Search Component */
  .nav-search {
    margin-right: 24px;
    z-index: 601;
  }

  .nav-search-container {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 100px;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .nav-search-container:focus-within {
    border-color: #667eea;
    background: rgba(255, 255, 255, 1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }

  .nav-search-icon {
    background: none;
    border: none;
    padding: 0;
    margin-left: 16px;
    margin-right: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #6C757D;
    transition: color 0.3s ease;
  }

  .nav-search-icon:hover {
    color: #667eea;
  }

  .nav-search-input {
    background: transparent;
    border: none;
    padding: 10px 16px 10px 0;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: #212529;
    width: 0;
    opacity: 0;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    outline: none;
  }

  .nav-search-input::placeholder {
    color: #ADB5BD;
  }

  .nav-search-container.expanded .nav-search-input {
    width: 200px;
    opacity: 1;
  }

  /* Navigation Links Styling */
  .nav-links {
    list-style: none;
    display: flex;
    gap: 32px;
    margin: 0;
    padding: 0;
    z-index: 601;
  }

  .nav-links li a {
    color: #9CA3AF;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.3s ease;
    position: relative;
    padding: 4px 0;
  }

  .nav-links li a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    transition: width 0.3s ease;
    border-radius: 2px;
  }

  .nav-links li a:hover {
    color: #E5E7EB;
  }

  .nav-links li a:hover::after {
    width: 100%;
  }

  /* CTA Button */
  .nav-cta {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 8px 24px;
    border-radius: 100px;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    z-index: 601;
    white-space: nowrap;
  }

  .nav-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    color: white;
  }

  /* Mobile Toggle Button */
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    width: 32px;
    height: 24px;
    position: relative;
    padding: 0;
    z-index: 602;
  }

  .toggle-bar {
    display: block;
    width: 100%;
    height: 2px;
    background: #E5E7EB;
    position: absolute;
    left: 0;
    transition: transform 0.3s ease, top 0.3s ease;
  }

  .toggle-bar:nth-child(1) {
    top: 4px;
  }

  .toggle-bar:nth-child(2) {
    top: 14px;
  }

  .nav-toggle.active .toggle-bar:nth-child(1) {
    top: 11px;
    transform: rotate(45deg);
  }

  .nav-toggle.active .toggle-bar:nth-child(2) {
    top: 11px;
    transform: rotate(-45deg);
  }

  /* Mobile Menu Custom Styling - Override base styles */
  .mobile-menu-link.mobile-cta-link {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    margin-top: 20px;
    border-radius: 100px;
    text-align: center;
    justify-content: center;
    gap: 8px;
    border-bottom: none !important;
    color: white !important;
  }

  .mobile-menu-link.mobile-cta-link::before {
    opacity: 0 !important;
  }

  .mobile-menu-link.mobile-cta-link:hover {
    transform: scale(1.02);
    box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
  }

  /* Responsive - LARGER LOGO ON SMALLER SCREENS */
  @media (max-width: 1024px) {
    .top-nav {
      padding: 16px 24px !important;
    }

    .top-nav.scrolled {
      padding: 12px 24px !important;
    }

    .nav-search {
      margin-right: 16px;
    }

    .nav-search-container.expanded .nav-search-input {
      width: 150px;
    }

    .nav-links {
      display: none;
    }

    .nav-cta {
      display: none;
    }

    .nav-toggle {
      display: block;
    }

    .nav-logo {
      width: 55px;
      height: 55px;
    }

    .logo-glow {
      width: 75px;
      height: 75px;
    }
  }

  @media (max-width: 768px) {
    .top-nav {
      padding: 14px 20px !important;
    }

    .top-nav.scrolled {
      padding: 10px 20px !important;
    }

    .nav-search {
      margin-right: 24px;
      z-index: 601;
    }

    .nav-search-container.expanded .nav-search-input {
      width: 120px;
    }

    .nav-logo {
      width: 65px;
      height: 65px;
    }

    .logo-glow {
      width: 85px;
      height: 85px;
    }
  }

  @media (max-width: 480px) {
    .top-nav {
      padding: 12px 16px !important;
    }

    .nav-logo {
      width: 70px;
      height: 70px;
    }

    .logo-glow {
      width: 95px;
      height: 95px;
    }

    .nav-brand {
      gap: 8px;
    }

    .nav-search-container.expanded .nav-search-input {
      width: 100px;
    }
  }

  /* Landscape mode fix */
  @media (max-height: 540px) and (orientation: landscape) {
    .top-nav {
      padding: 8px 20px !important;
    }

    .nav-logo {
      width: 45px;
      height: 45px;
    }

    .mobile-menu-inner {
      padding: 60px 32px 20px !important;
    }
  }
</style>

<script>
  // Mobile menu toggle functionality
  (function () {
    const navToggle = document.getElementById('navToggle');
    const mobileMenu = document.getElementById('mobileMenu');
    const body = document.body;

    function toggleMenu() {
      const isOpen = navToggle.classList.contains('active');

      if (isOpen) {
        navToggle.classList.remove('active');
        mobileMenu.classList.remove('open');
        body.classList.remove('menu-open');
        navToggle.setAttribute('aria-expanded', 'false');
      } else {
        navToggle.classList.add('active');
        mobileMenu.classList.add('open');
        body.classList.add('menu-open');
        navToggle.setAttribute('aria-expanded', 'true');
      }
    }

    navToggle.addEventListener('click', toggleMenu);

    // Close menu when clicking on a mobile link
    document.querySelectorAll('.mobile-menu-link').forEach(link => {
      link.addEventListener('click', () => {
        navToggle.classList.remove('active');
        mobileMenu.classList.remove('open');
        body.classList.remove('menu-open');
        navToggle.setAttribute('aria-expanded', 'false');
      });
    });

    // Close menu on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && mobileMenu.classList.contains('open')) {
        toggleMenu();
      }
    });
  })();

  // Simple search functionality
  (function () {
    const searchContainer = document.querySelector('.nav-search-container');
    const searchIcon = document.getElementById('navSearchIcon');
    const searchInput = document.getElementById('navSearchInput');

    let isExpanded = false;

    function expandSearch() {
      if (isExpanded) return;
      isExpanded = true;
      searchContainer.classList.add('expanded');
      searchInput.focus();
    }

    function collapseSearch() {
      if (!isExpanded) return;
      isExpanded = false;
      searchContainer.classList.remove('expanded');
      searchInput.value = '';
      searchInput.blur();
    }

    if (searchIcon) {
      searchIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isExpanded) {
          collapseSearch();
        } else {
          expandSearch();
        }
      });
    }

    if (searchInput) {
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && searchInput.value.trim()) {
          const query = searchInput.value.trim();
          window.location.href = `/search/?q=${encodeURIComponent(query)}`;
        }
      });
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.nav-search')) {
        collapseSearch();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isExpanded) {
        collapseSearch();
      }
    });
  })();

  // Scroll effect for nav background
  (function () {
    const nav = document.getElementById('topNav');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    });
  })();
</script>
