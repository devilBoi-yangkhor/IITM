<!-- Edit User Modal -->
<div id="editModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3 class="modal-title">Edit User</h3>
            <button class="modal-close">
                <iconify-icon icon="solar:close-circle-linear" class="text-2xl"></iconify-icon>
            </button>
        </div>

        <form id="editUserForm" method="post" action="{% url 'user_management' %}">
            {% csrf_token %}
            <input type="hidden" name="user_id" id="modal_user_id">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" id="modal_username" class="form-input-readonly" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="full_name" id="modal_full_name" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" id="modal_email" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone_number" id="modal_phone" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Role</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="is_student" id="modal_is_student" class="checkbox"> Student
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="is_teacher" id="modal_is_teacher" class="checkbox"> Teacher
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="is_active" id="modal_is_active" class="checkbox"> Active Account
                    </label>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel">Cancel</button>
                <button type="submit" class="btn-save">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<style>
    /* ── Shared Modal Base ── */
    .modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .modal-container {
        background: white;
        border-radius: 16px;
        width: 90%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        animation: modalSlideIn 0.3s ease-out;
    }

    .dark .modal-container {
        background: #1e293b;
    }

    .modal-sm {
        max-width: 400px;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid #e2e8f0;
    }

    .dark .modal-header {
        border-bottom-color: #334155;
    }

    .modal-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: #0f172a;
    }

    .dark .modal-title {
        color: #f1f5f9;
    }

    .modal-close {
        color: #94a3b8;
        background: none;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
    }

    .modal-close:hover {
        color: #475569;
        transform: rotate(90deg);
    }

    .dark .modal-close:hover {
        color: #cbd5e1;
    }

    .modal-body {
        padding: 20px;
    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding: 16px 20px;
        border-top: 1px solid #e2e8f0;
    }

    .dark .modal-footer {
        border-top-color: #334155;
    }

    /* ── Form Elements ── */
    .form-group {
        margin-bottom: 16px;
    }

    .form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 6px;
        color: #334155;
    }

    .dark .form-label {
        color: #cbd5e1;
    }

    .form-input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: white;
        color: #0f172a;
        transition: all 0.2s;
    }

    .form-input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .dark .form-input {
        background: #0f172a;
        border-color: #334155;
        color: #f1f5f9;
    }

    .form-input-readonly {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f1f5f9;
        color: #64748b;
        cursor: not-allowed;
    }

    .dark .form-input-readonly {
        background: #334155;
        border-color: #475569;
        color: #94a3b8;
    }

    .checkbox-group {
        display: flex;
        gap: 16px;
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
        color: #334155;
        cursor: pointer;
        transition: all 0.2s;
    }

    .checkbox-label:hover {
        transform: translateX(2px);
    }

    .dark .checkbox-label {
        color: #cbd5e1;
    }

    .checkbox {
        width: 16px;
        height: 16px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .checkbox:hover {
        transform: scale(1.1);
    }

    /* ── Buttons ── */
    .btn-cancel {
        padding: 8px 16px;
        font-size: 0.875rem;
        font-weight: 500;
        color: #64748b;
        background: transparent;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .btn-cancel:hover {
        background: #f1f5f9;
        transform: translateY(-2px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .dark .btn-cancel {
        border-color: #475569;
        color: #94a3b8;
    }

    .dark .btn-cancel:hover {
        background: #334155;
    }

    .btn-save {
        padding: 8px 16px;
        font-size: 0.875rem;
        font-weight: 500;
        color: white;
        background: #3b82f6;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .btn-save:hover {
        background: #2563eb;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* ── Scrollbar ── */
    .modal-container::-webkit-scrollbar { width: 6px; }
    .modal-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    .modal-container::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
    .modal-container::-webkit-scrollbar-thumb:hover { background: #555; }
    .dark .modal-container::-webkit-scrollbar-track { background: #334155; }
    .dark .modal-container::-webkit-scrollbar-thumb { background: #64748b; }

    @keyframes modalSlideIn {
        from { opacity: 0; transform: translateY(-30px); }
        to   { opacity: 1; transform: translateY(0); }
    }
</style>

<script>
    // ── Edit Modal ──────────────────────────────────────────
    function openEditModal(userId, username, fullName, email, phone, isStudent, isTeacher, isActive) {
        document.getElementById('modal_user_id').value    = userId;
        document.getElementById('modal_username').value   = username;
        document.getElementById('modal_full_name').value  = fullName;
        document.getElementById('modal_email').value      = email;
        document.getElementById('modal_phone').value      = phone;
        document.getElementById('modal_is_student').checked = isStudent;
        document.getElementById('modal_is_teacher').checked = isTeacher;
        document.getElementById('modal_is_active').checked  = isActive;

        document.getElementById('editModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
        document.body.style.overflow = '';
    }

    // Close on overlay click
    document.getElementById('editModal')?.addEventListener('click', function (e) {
        if (e.target === this) closeEditModal();
    });

    // Close button & cancel inside this modal
    document.querySelectorAll('#editModal .modal-close, #editModal .btn-cancel').forEach(function (btn) {
        btn.addEventListener('click', closeEditModal);
    });
</script>
