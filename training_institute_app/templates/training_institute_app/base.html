{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Institute — Yang Khor Private Limited</title>

<!-- Favicon -->
<link rel="icon" type="image/jpeg" href="{% static 'images/favicon.jpeg' %}">
<link rel="shortcut icon" type="image/jpeg" href="{% static 'images/favicon.png' %}">
<link rel="apple-touch-icon" href="{% static 'images/favicon.png' %}">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome 6 (Free) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- SweetAlert2 CSS & JS -->
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Main Styles -->
<link rel="stylesheet" href="{% static 'css/basestyles.css' %}">
<link rel="stylesheet" href="{% static 'css/courses_details.css' %}">

<!-- Page Loader CSS -->
<style>
  /* Loader stays BEHIND navbar */
  .yangKhorLoaderOverlay123 {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: -webkit-linear-gradient(#272a41, #678cc4);
    background: linear-gradient(#272a41, #121d2e);
    z-index: 100;
  }

  .yangKhorLoaderText456 {
    position: absolute;
    top: 50%;
    width: 100%;  
    height: auto;
    transform: translate(0,-50%);
  }
  
  .yangKhorLoaderText456 p {
    font-size: 1.5rem;
    color: #fff;
    text-align: center;
    font-family: 'Montserrat', monospace;
    font-weight: 500;
    letter-spacing: 2px;
    margin: 0;
  }
  
  @keyframes yangKhorProgressAnim1 {
    0% {
      transform: scalex(0);
      opacity: .5;
    }
    100% {
      transform: scalex(1);
      opacity: 1;
    }
  }
  
  @keyframes yangKhorProgressAnim2 {
    0% {
      transform: scale(0.3, 0.8);
      opacity: 0;
    }
    100% {
      transform: scale(1, 1) translatex(100vw);
      opacity: 1;
    }
  }
  
  .yangKhorProgressBar321 {
    position: absolute;
    top: 55%;
    width: 100%;  
    height: 3px;
    background: rgba(255, 255, 255, 0.1);
    transform: translate(0,-50%);
  }
  
  .yangKhorProgressBar321:before {
    animation: yangKhorProgressAnim1 2s linear forwards;
    transform-origin: 0 0;
    content: "";
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(to right, rgba(255, 255, 255, 0.1) 10%, rgba(255, 255, 255, 0.4) 80%, white);
  }
  
  .yangKhorProgressBar321:after {
    content: "";
    position: absolute;
    animation: yangKhorProgressAnim2 2s linear forwards;
    transform-origin: 90% 50%;
    margin-left: -24px;
    top: -9px;
    width: 30px;
    height: 21px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.55);
    filter: blur(8px);
    box-shadow: 0 0 10px 6px rgba(210, 189, 255, 0.4), -20px 0 15px 4px rgba(210, 189, 255, 0.3);
  }
  
  /* Main content - hidden until loaded */
  .yangKhorMainWrapper654 {
    opacity: 0;
    position: relative;
    z-index: 1;
  }
  
  .yangKhorMainWrapper654.visible {
    opacity: 1;
  }
  
  .nav-logo {
    height: 40px;
    width: auto;
    object-fit: contain;
    display: block;
  }

  .nav-brand {
    padding: 0;
    display: flex;
    align-items: center;
  }
</style>
</head>
<body>

<!-- Page Loader -->
<div class="yangKhorLoaderOverlay123" id="yangKhorLoaderOverlay123">
  <div class="yangKhorLoaderText456"><p>0%</p></div>
  <div class="yangKhorProgressBar321"></div>
</div>

<!-- Main Content Wrapper -->
<div class="yangKhorMainWrapper654" id="yangKhorMainWrapper654">
  <svg class="grain" width="100%" height="100%">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="5" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
  <div class="atmosphere"></div>

  {% block content %}{% endblock %}
</div>

<!-- jQuery -->

<!-- Page Loader JavaScript - NO DELAYS, INSTANT HIDE -->
<script>
$(document).ready(function() {
  // Set loader height
  var h = window.innerHeight;
  $('#yangKhorLoaderOverlay123').css('height', h);
  
  var al = 0;
  var percentageInterval;
  var assetsLoaded = false;
  
  // Progress counter - counts to 100
  function progressSim() {
    if(al >= 100) {
      clearInterval(percentageInterval);
      checkAndHideLoader();
    } else {
      al = Math.min(al + 2, 100);
      $('.yangKhorLoaderText456 p').html(al + '%');
    }
  }
  
  percentageInterval = setInterval(progressSim, 30);
  
  // HIDE LOADER INSTANTLY when assets are loaded
  function checkAndHideLoader() {
    if(assetsLoaded) {
      // Instantly hide loader - NO fade, NO delay
      $('#yangKhorLoaderOverlay123').hide();
      // Show main content instantly
      $('#yangKhorMainWrapper654').addClass('visible');
    }
  }
  
  // Wait for ALL assets to load
  function waitForAllAssets() {
    var allAssets = [];
    var loadedCount = 0;
    
    // Get all images
    var images = document.querySelectorAll('img');
    for(var i = 0; i < images.length; i++) {
      allAssets.push(images[i]);
    }
    
    // Get all stylesheets
    var stylesheets = document.querySelectorAll('link[rel="stylesheet"]');
    for(var i = 0; i < stylesheets.length; i++) {
      allAssets.push(stylesheets[i]);
    }
    
    // Get all external scripts
    var scripts = document.querySelectorAll('script[src]');
    for(var i = 0; i < scripts.length; i++) {
      allAssets.push(scripts[i]);
    }
    
    var totalAssets = allAssets.length;
    
    if(totalAssets === 0) {
      assetsLoaded = true;
      checkAndHideLoader();
      return;
    }
    
    function assetLoaded() {
      loadedCount++;
      if(loadedCount === totalAssets) {
        assetsLoaded = true;
        checkAndHideLoader();
      }
    }
    
    // Check each asset
    for(var i = 0; i < allAssets.length; i++) {
      var asset = allAssets[i];
      
      if(asset.complete) {
        assetLoaded();
      } else {
        asset.addEventListener('load', assetLoaded);
        asset.addEventListener('error', assetLoaded);
      }
    }
    
    // Fallback: Force hide after 2 seconds max
    setTimeout(function() {
      if(!assetsLoaded) {
        assetsLoaded = true;
        checkAndHideLoader();
      }
    }, 2000);
  }
  
  // Start waiting for assets
  waitForAllAssets();
  
  // Handle window resize
  $(window).resize(function() {
    var newHeight = window.innerHeight;
    $('#yangKhorLoaderOverlay123').css('height', newHeight);
  });
});
</script>

<!-- Your main JS file -->
<script src="{% static 'js/basestyles.js' %}"></script>

<!-- Make sure navbar is interactive -->
<script>
$(document).ready(function() {
  // Force navbar to be above everything
  $('.top-nav').css('z-index', '600');
  
  // Make sure mobile menu works
  $('#navToggle').on('click', function() {
    $('#mobileMenu').toggleClass('open');
    $(this).toggleClass('active');
    $('body').toggleClass('menu-open');
  });
});
</script>
</body>
</html>
